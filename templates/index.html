<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Flask + MariaDB CRUD</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    input, textarea { width: 100%; box-sizing: border-box; margin-bottom: .5rem; padding: .4rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    li { margin-bottom: .5rem; }
    .del { margin-left: 1rem; }
  </style>
</head>
<body>
  <h1>Items (Flask + MariaDB)</h1>

  <form id="form">
    <input id="title" type="text" placeholder="Titolo" required>
    <textarea id="note" placeholder="Nota" rows="2"></textarea>
    <button type="submit">Crea</button>
  </form>

  <ul id="list"></ul>

  <script>
    async function load() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      items.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = `${item.id} - ${item.title} (${item.note || ''})`;
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'elimina';
        del.onclick = () => remove(item.id);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    async function create() {
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('title').value,
          note: document.getElementById('note').value,
        }),
      });
      document.getElementById('form').reset();
      load();
    }

    async function remove(id) {
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      load();
    }

    document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); create(); });
    load();
  </script>
</body>
</html>
